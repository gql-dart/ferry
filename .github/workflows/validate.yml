name: Validate
on: pull_request

env:
  # The Flutter SDK pins exact versions of some packages (test_api, for
  # example), so the workspace's pubspec.lock depends on the Flutter version.
  # When changing it, run `melos bs` with the new version and commit
  # pubspec.lock, or the format job fails on the lockfile diff.
  FLUTTER_VERSION: 3.47.8
  # Keep in sync with melos in the root pubspec.yaml.
  MELOS_VERSION: 7.8.2

jobs:
  verify_commits:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional PRs
        uses: Namchee/conventional-pr@v0.4.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          link_issue: false

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Activate melos
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          dart pub global activate melos ${{ env.MELOS_VERSION }}
      - name: Bootstrap melos
        run: melos bs
      - name: Analyze package
        run: melos exec -- flutter analyze --no-fatal-infos

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Activate melos
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          dart pub global activate melos ${{ env.MELOS_VERSION }}
      - name: Bootstrap melos
        run: melos bs
      - name: Validate formatting
        run: |
          melos exec -- dart format -o write .
          ./.github/workflows/scripts/validate-formatting.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Activate melos
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          dart pub global activate melos ${{ env.MELOS_VERSION }}
      - name: Bootstrap melos
        run: melos bs
      - name: Run tests
        run: melos run test
