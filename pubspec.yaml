name: ferry_workspace
publish_to: none

environment:
  sdk: ^3.9.0

# All packages resolve together into the root pubspec.lock. Path and version
# dependencies on these packages resolve to the local copies.
workspace:
  - examples/auth_token_with_isolate/client
  - examples/pokemon_explorer
  - examples/pokemon_explorer2
  - packages/ferry
  - packages/ferry_cache
  - packages/ferry_exec
  - packages/ferry_flutter
  - packages/ferry_generator
  - packages/ferry_generator2
  - packages/ferry_generator2_end_to_end
  - packages/ferry_hive_ce_store
  - packages/ferry_hive_store
  - packages/ferry_store
  - packages/ferry_test_external_schema
  - packages/ferry_test_graphql2
  - packages/normalize

dev_dependencies:
  melos: ^8.9.0

melos:
  scripts:
    build:
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner
    analyze:
      exec: flutter analyze --no-fatal-infos

    test:
      run: |
        melos run test:dart --no-select
        melos run test:flutter --no-select
      description: Run all tests (dart test for Dart packages, flutter test for Flutter packages)

    test:dart:
      exec: dart test
      packageFilters:
        flutter: false
        dirExists: test
      description: Run tests in Dart-only packages

    test:flutter:
      exec: flutter test
      packageFilters:
        flutter: true
        dirExists: test
      description: Run tests in Flutter packages
